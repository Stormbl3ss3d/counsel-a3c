# Online eval of the BC clone of COUNSEL A3C fix5 m900 (greedy teacher) vs its teacher (greedy and sampled).
# Needs: vllm serve <repo>/results/bc/fix5g/models/l1b-e1/merged --served-model-name bc-fix5g-l1b-e1
name = "slm-bcfix5"

[eval]
seeds = "1000-1009"
modes = ["greedy", "sample"]
baselines = ["noop", "random", "heur", "const:1x2"]
reference = ["random", "heur"]

[vllm]
base = "http://localhost:9000"

[[models]]
label = "fix5"
from = "a3c/t113-fix5-f5-c3"
checkpoints = [900]

[[slm]]
label = "bcfix5"
model = "bc-fix5g-l1b-e1"
prompt = "operator"
