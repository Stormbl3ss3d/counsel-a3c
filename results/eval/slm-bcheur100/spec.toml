# Online eval of the BC clone of heur (tools/bc_*.py, run heur100/l1b-e2) against its teacher,
# random, a constant policy, and COUNSEL's best A3C checkpoint, on the eval seeds 1000-1009.
# Needs:  vllm serve <repo>/results/bc/heur100/models/l1b-e2/merged --served-model-name bc-heur100-l1b-e2
# Smoke first with seeds = "1000-1001", then set "1000-1009" and re-run the same command (it resumes).
name = "slm-bcheur100"

[eval]
seeds = "1000-1009"
modes = ["greedy", "sample"]
baselines = ["noop", "random", "heur", "const:1x2"]
reference = ["random", "heur"]

[vllm]
base = "http://localhost:9000"

[[models]]
label = "fix5"
from = "a3c/t113-fix5-f5-c3"
checkpoints = [900]

[[slm]]
label = "bcheur"
model = "bc-heur100-l1b-e2"
prompt = "operator"
