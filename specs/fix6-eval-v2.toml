# Re-run of the hand-made fix6-eval (2026-11-11), now as one command.
# Evaluation only: every model points at checkpoints that already exist.
#   python3 tools/counselctl.py run specs/fix6-eval-v2.toml
name    = "fix6-eval-v2"
image   = "counsel:t113"
workers = 4

[conditions]          # authors' inference.py setup; also what fix5/fix6 were trained on
slo     = 150         # freq left at 0 = 1e6/slo = 6666
budget  = [2500, 3600]
overrun = 0.2

[eval]
seeds     = "1000-1009"
modes     = ["greedy", "sample"]
baselines = ["noop", "random", "largest", "heur", "const:1x2"]
reference = ["random", "heur"]

[[models]]
label = "fix5"
from  = "a3c/t113-fix5-f5-c3"

[[models]]
label = "e0"
from  = "a3c/t113-fix6-f5-c3-ent0"

[[models]]
label = "e1"
from  = "a3c/t113-fix6-f5-c3-ent001"
