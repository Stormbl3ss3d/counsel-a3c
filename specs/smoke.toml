# Smoke test of the whole pipeline: one existing checkpoint plus one tiny training run.
# Checks the plumbing, not a result. A few minutes.
#   python3 tools/counselctl.py run specs/smoke.toml
name    = "smoke-01"
workers = 2

[eval]
seeds     = "1000-1001"
baselines = ["random", "heur", "const:1x2"]

[[models]]                      # evaluate only
label       = "fix5"
from        = "a3c/t113-fix5-f5-c3"
checkpoints = [900]

[[models]]                      # trained first (6 episodes, watchdog on), then evaluated
label = "tiny"
train = { code = "fix6", episodes = 6, ent = 0.001 }
